<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>fast. — Ultra running routes in 3D</title>
<meta name="description" content="Interactive 3D terrain maps of ultra-trail race routes: UTMB Mont-Blanc, Eiger Ultra Trail E250, Ultra-trail Cape Town, Tor des Géants and Madeira Island Ultra-Trail.">
<meta name="theme-color" content="#0d1015">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1015'/%3E%3Cpath d='M4 24l7-11 4 6 4-9 9 14z' fill='%23ff5a36'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>

<main class="stage">
  <div id="map" aria-label="3D route map"></div>

  <aside class="panel" id="panel">
    <header class="panel-head">
      <a class="brand" href="https://jacobcloete.pro" title="jacobcloete.pro">fast<span>.</span></a>
      <p class="tagline">Ultra routes in 3D</p>
    </header>

    <nav class="route-tabs" id="route-tabs" role="tablist" aria-label="Race routes"></nav>

    <section class="route-info" aria-live="polite">
      <h1 id="route-name">&nbsp;</h1>
      <p class="route-place" id="route-place">&nbsp;</p>
      <dl class="stats">
        <div><dt>Distance</dt><dd id="stat-dist">–</dd></div>
        <div><dt>Climb</dt><dd id="stat-gain">–</dd></div>
        <div><dt>High point</dt><dd id="stat-max">–</dd></div>
        <div><dt>Low point</dt><dd id="stat-min">–</dd></div>
      </dl>
      <p class="route-blurb" id="route-blurb"></p>
    </section>

    <section class="controls" aria-label="Map controls">
      <div class="control-row">
        <button type="button" class="btn btn-primary" id="fly-btn">
          <span class="ico" id="fly-ico">▶</span><span id="fly-label">Fly the route</span>
        </button>
        <button type="button" class="btn btn-square" id="speed-btn" title="Fly-through speed" aria-label="Fly-through speed">1×</button>
        <button type="button" class="btn btn-square" id="reset-btn" title="Show whole route" aria-label="Show whole route">⤢</button>
      </div>
      <div class="control-row">
        <div class="seg" role="group" aria-label="Base map">
          <button type="button" class="seg-btn is-active" data-basemap="satellite">Satellite</button>
          <button type="button" class="seg-btn" data-basemap="topo">Topo</button>
        </div>
      </div>
      <label class="control-row slider-row">
        <span>Relief <b id="relief-val">×1.3</b></span>
        <input type="range" id="relief" min="1" max="2.5" step="0.1" value="1.3" aria-label="Terrain exaggeration">
      </label>
    </section>

    <footer class="panel-foot">
      <span id="route-edition"></span> GPX from <a id="route-source" href="#" target="_blank" rel="noopener"></a>.
      Stats are computed from the track.
    </footer>
  </aside>

  <div class="loading" id="loading" hidden><span class="spinner"></span><span id="loading-text">Loading route…</span></div>
</main>

<section class="profile" id="profile" aria-label="Elevation profile">
  <div class="profile-head">
    <span class="profile-title">Elevation</span>
    <span class="profile-readout" id="readout">Hover the profile or the route · click to jump there</span>
  </div>
  <canvas id="profile-canvas"></canvas>
</section>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="js/routes.js?v=12"></script>
<script src="js/app.js?v=12"></script>
</body>
</html>
